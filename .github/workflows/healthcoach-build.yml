name: Build HealthCoach
on:
  push:
    branches: [ main ]
    paths: ['HealthCoach/**', '.github/workflows/healthcoach-build.yml']
  workflow_dispatch:
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build
        working-directory: HealthCoach
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: HealthCoach-debug
          path: HealthCoach/app/build/outputs/apk/debug/app-debug.apk
