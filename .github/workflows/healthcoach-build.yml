name: HealthCoach APK
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'healthcoach-temp/**'
      - '.github/workflows/healthcoach-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        working-directory: healthcoach-temp
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: HealthCoach-debug
          path: healthcoach-temp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
