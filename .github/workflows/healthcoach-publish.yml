name: Publish HealthCoach
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      HEALTHCOACH_KEYSTORE_PASSWORD: ${{ secrets.MEGAMOBILE_SIGNING_STORE_PASSWORD }}
      HEALTHCOACH_KEY_ALIAS: ${{ secrets.MEGAMOBILE_SIGNING_KEY_ALIAS }}
      HEALTHCOACH_KEY_PASSWORD: ${{ secrets.MEGAMOBILE_SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.MEGAMOBILE_SIGNING_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/healthcoach.jks"
          echo "HEALTHCOACH_KEYSTORE_PATH=$RUNNER_TEMP/healthcoach.jks" >> "$GITHUB_ENV"
      - name: Build signed HealthCoach
        working-directory: HealthCoach
        run: gradle --no-daemon :app:lintRelease :app:assembleRelease --stacktrace
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp HealthCoach/app/build/outputs/apk/release/app-release.apk HealthCoach-2.0.0.apk
          gh release delete healthcoach-v2.0.0 --yes || true
          git push --delete origin healthcoach-v2.0.0 || true
          gh release create healthcoach-v2.0.0 HealthCoach-2.0.0.apk --title "HealthCoach 2.0.0" --notes "Synchronisation configurable, heures fixes, export Santé Connect vers Drive et mise à jour intégrée."
