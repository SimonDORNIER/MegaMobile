name: HealthCoach Final APK
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'healthcoach-final/**'
      - '.github/workflows/healthcoach-final-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build unsigned release APK
        working-directory: healthcoach-final
        run: gradle :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: HealthCoach-unsigned
          path: healthcoach-final/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
