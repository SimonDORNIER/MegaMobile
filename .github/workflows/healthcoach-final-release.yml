name: Publish HealthCoach Final
on:
  push:
    branches: [ healthcoach-v223-stable ]
    paths:
      - 'healthcoach-final/**'
      - '.github/workflows/healthcoach-final-release.yml'
permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build unsigned release
        working-directory: healthcoach-final
        run: gradle :app:assembleRelease --stacktrace
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.MEGAMOBILE_SIGNING_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/healthcoach.jks"
      - name: Sign APK
        env:
          STORE_PASSWORD: ${{ secrets.MEGAMOBILE_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MEGAMOBILE_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MEGAMOBILE_SIGNING_KEY_PASSWORD }}
        run: |
          BT_DIR="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT_DIR/apksigner" sign             --ks "$RUNNER_TEMP/healthcoach.jks"             --ks-key-alias "$KEY_ALIAS"             --ks-pass pass:"$STORE_PASSWORD"             --key-pass pass:"$KEY_PASSWORD"             --out HealthCoach-2.2.3.apk             healthcoach-final/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT_DIR/apksigner" verify --verbose HealthCoach-2.2.3.apk
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete healthcoach-v2.2.3 --yes || true
          git push --delete origin healthcoach-v2.2.3 || true
          gh release create healthcoach-v2.2.3 HealthCoach-2.2.3.apk             --title "HealthCoach 2.2.3"             --notes "Synchronisation automatique fiable : alarme exacte, service de premier plan court, wakelock et WorkManager de secours."
