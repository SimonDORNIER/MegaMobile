name: Publish HealthCoach Final
on:
  push:
    branches: [ healthcoach-v200-sync ]
    paths:
      - 'healthcoach-final/**'
      - '.github/workflows/healthcoach-final-release.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Read version
        run: |
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' healthcoach-final/app/build.gradle.kts | head -1)"
          VERSION_CODE="$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' healthcoach-final/app/build.gradle.kts | head -1)"
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Build unsigned release
        working-directory: healthcoach-final
        run: gradle :app:assembleRelease --stacktrace

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.MEGAMOBILE_SIGNING_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/healthcoach.jks"

      - name: Sign APK
        env:
          STORE_PASSWORD: ${{ secrets.MEGAMOBILE_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MEGAMOBILE_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MEGAMOBILE_SIGNING_KEY_PASSWORD }}
        run: |
          BT_DIR="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT_DIR/apksigner" sign             --ks "$RUNNER_TEMP/healthcoach.jks"             --ks-key-alias "$KEY_ALIAS"             --ks-pass pass:"$STORE_PASSWORD"             --key-pass pass:"$KEY_PASSWORD"             --out "HealthCoach-${VERSION_NAME}.apk"             healthcoach-final/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT_DIR/apksigner" verify --verbose "HealthCoach-${VERSION_NAME}.apk"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="healthcoach-v${VERSION_NAME}"
          gh release delete "$TAG" --yes || true
          git push --delete origin "$TAG" || true
          gh release create "$TAG" "HealthCoach-${VERSION_NAME}.apk"             --title "HealthCoach ${VERSION_NAME}"             --notes "Synchronisation automatique Health Connect vers Drive, diagnostics intégrés et mise à jour automatique via GitHub."
