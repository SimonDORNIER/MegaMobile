name: Publish MegaMobile release

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: Notes affichées dans le manifeste de mise à jour
        required: true
        type: string

concurrency:
  group: megamobile-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      MEGAMOBILE_KEYSTORE_PASSWORD: ${{ secrets.MEGAMOBILE_SIGNING_STORE_PASSWORD }}
      MEGAMOBILE_KEY_ALIAS: ${{ secrets.MEGAMOBILE_SIGNING_KEY_ALIAS }}
      MEGAMOBILE_KEY_PASSWORD: ${{ secrets.MEGAMOBILE_SIGNING_KEY_PASSWORD }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Test release tooling
        run: python3 -m unittest discover -s tools/tests -v

      - name: Restore signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.MEGAMOBILE_SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEYSTORE_BASE64"
          test -n "$MEGAMOBILE_KEYSTORE_PASSWORD"
          test -n "$MEGAMOBILE_KEY_ALIAS"
          test -n "$MEGAMOBILE_KEY_PASSWORD"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/megamobile-release.jks"
          chmod 600 "$RUNNER_TEMP/megamobile-release.jks"
          echo "MEGAMOBILE_KEYSTORE_PATH=$RUNNER_TEMP/megamobile-release.jks" >> "$GITHUB_ENV"

      - name: Resolve application version
        run: |
          set -euo pipefail
          version_info=$(./gradlew --no-daemon -q :app:printVersionInfo)
          version_code=${version_info%%|*}
          version_name=${version_info#*|}
          test "$version_code" -gt 0
          test -n "$version_name"
          echo "VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$version_name" >> "$GITHUB_ENV"

      - name: Test, lint and build signed APK
        run: ./gradlew --no-daemon clean test lint :app:assembleRelease --stacktrace

      - name: Verify signing identity
        run: tools/verify_release_signer.sh app/build/outputs/apk/release/app-release.apk

      - name: Generate live update payload
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          python3 tools/publish_live_update.py \
            --apk app/build/outputs/apk/release/app-release.apk \
            --version-code "$VERSION_CODE" \
            --version-name "$VERSION_NAME" \
            --repository SimonDORNIER/MegaMobile \
            --note "$RELEASE_NOTES"
          python3 tools/verify_live_update.py --output /tmp/MegaMobile-live.apk
          tools/verify_release_signer.sh /tmp/MegaMobile-live.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: MegaMobile-${{ env.VERSION_NAME }}-signed
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      - name: Commit live payload
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add live/app.json live/apk
          git diff --cached --quiet && { echo 'Aucun changement à publier'; exit 1; }
          git commit -m "Publish MegaMobile ${VERSION_NAME}"
          git push origin HEAD:main
