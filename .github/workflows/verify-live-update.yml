name: Verify MegaMobile live update

permissions:
  contents: read

on:
  push:
    paths:
      - '.github/workflows/verify-live-update.yml'
      - 'tools/verify_live_update.py'
      - 'tools/verify_release_signer.sh'
      - 'release/signing-certificate.sha256'
      - 'live/app.json'
      - 'live/apk/**'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild and verify published APK
        run: python3 tools/verify_live_update.py --output /tmp/MegaMobile-live.apk

      - name: Verify APK signer
        run: tools/verify_release_signer.sh /tmp/MegaMobile-live.apk
