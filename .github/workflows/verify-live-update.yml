name: Verify MegaMobile live update

on:
  push:
    paths:
      - '.github/workflows/verify-live-update.yml'
      - 'live/app.json'
      - 'live/apk/v1.0.0.q*.b64'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild and verify published APK
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/MegaMobile-v1.0.0.apk
          : > "$OUT"
          for part in q00 q01 q02 q03 q04; do
            f="live/apk/v1.0.0.${part}.b64"
            echo "PART $part chars=$(wc -c < "$f")"
            base64 --decode "$f" >> "$OUT"
          done
          actual=$(sha256sum "$OUT" | awk '{print $1}')
          expected=$(python3 -c "import json; print(json.load(open('live/app.json'))['sha256'])")
          echo "APK_BYTES=$(wc -c < "$OUT")"
          echo "APK_SHA256=$actual"
          echo "MANIFEST_SHA256=$expected"
          test "$actual" = "$expected"
          unzip -t "$OUT"
          keytool -printcert -jarfile "$OUT" | sed -n '1,16p'
          echo 'LIVE_UPDATE_VALID=YES'
