name: Build Health Bridge APK

on:
  push:
    branches: [ healthbridge ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore Health Bridge source
        shell: bash
        run: |
          echo '[... omitted for brevity in this tool call ...]' | base64 -d > /tmp/HealthBridge-source.zip
          unzip -q /tmp/HealthBridge-source.zip -d .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: yes | sdkmanager --licenses || true
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        working-directory: HealthBridge
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: HealthBridge-debug-apk
          path: HealthBridge/app/build/outputs/apk/debug/app-debug.apk
