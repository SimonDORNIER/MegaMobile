name: Build Health Bridge APK

on:
  push:
    branches: [ healthbridge ]
    paths:
      - 'HealthBridge/**'
      - '.github/workflows/healthbridge-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: HealthBridge
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: HealthBridge-debug-apk
          path: HealthBridge/app/build/outputs/apk/debug/app-debug.apk
